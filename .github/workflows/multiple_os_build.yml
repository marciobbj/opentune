name: Multi-Platform Build
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare_release:
    name: Prepare release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pubspec version
        id: version
        shell: bash
        run: |
          version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          if [ -z "$version" ]; then
            echo "::error::Could not find version in pubspec.yaml"
            exit 1
          fi

          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          current_sha="$(git rev-parse HEAD)"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "$tag")"
            if [ "$tag_sha" != "$current_sha" ]; then
              echo "::error::Tag $tag already exists on another commit. Update version in pubspec.yaml."
              exit 1
            fi

            echo "Tag $tag already exists on this commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "$tag"

  build:
    name: Build for ${{ matrix.target }}
    needs: prepare_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-linux
            os: ubuntu-latest
            build_cmd: |
              sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
              export PATH="$FLUTTER_ROOT/bin:$PATH"
              flutter build apk --release
              flutter build linux --release
              zip -rj linux-release.zip build/linux/x64/release/bundle/
            artifacts: "build/app/outputs/flutter-apk/*.apk,linux-release.zip"
          
          - target: windows
            os: windows-latest
            build_cmd: |
              flutter build windows --release
              powershell Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows-release.zip -Force
            artifacts: "windows-release.zip"

          - target: macos
            os: macos-latest
            build_cmd: |
              flutter build macos --release
              zip -r macos-release.zip build/macos/Build/Products/Release/*.app
            artifacts: "macos-release.zip"

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        if: matrix.target == 'android-linux'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Flutter SDK path
        if: matrix.target == 'android-linux'
        shell: bash
        run: |
          flutter_bin="$(readlink -f "$(command -v flutter)")"
          flutter_root="$(cd "$(dirname "$flutter_bin")/.." && pwd)"
          echo "FLUTTER_ROOT=$flutter_root" >> "$GITHUB_ENV"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Platform
        run: ${{ matrix.build_cmd }}

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ matrix.artifacts }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: false
          tag: ${{ needs.prepare_release.outputs.tag }}
          name: ${{ needs.prepare_release.outputs.version }}
